<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AELORIA — Handmade Whimsy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">

  <style>
    :root {
      --vanilla: #FFF8E2;
      --white: #FFFFFF;
      --butter: #FFEFB9;
      --brown: #5E442E;
      --red: #C85555;
      --green: #767B39;
      --melon: #F7BCB0;
      --blue: #BFDDF0;
      --cream-dark: #F5EBCB;
      --shadow: rgba(94,68,46,0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--white);
      color: var(--brown);
      font-family: "Playfair Display", serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    input {
      font: inherit;
    }

    /* ==================================================
       AELORIA BRAND FONT
       Every AELORIA / Aeloria occurrence uses this font.
       ================================================== */

    .brand,
    .brand *,
    .aeloria-text,
    [data-brand="aeloria"] {
      font-family: "Shadows Into Light Two", cursive !important;
      letter-spacing: 1px;
    }

    /* ==================================================
       HEADER
       ================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,248,226,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(94,68,46,0.12);
    }

    .topbar {
      max-width: 1200px;
      margin: auto;
      min-height: 82px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 42px;
      line-height: 1;
      color: var(--brown);
      white-space: nowrap;
    }

    .tagline {
      font-size: 12px;
      color: var(--green);
      margin-top: 3px;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
    }

    nav a {
      position: relative;
      transition: 0.25s ease;
    }

    nav a:hover {
      color: var(--red);
      transform: translateY(-2px);
    }

    .cart-link {
      background: var(--red);
      color: white;
      padding: 9px 17px;
      border-radius: 25px;
      box-shadow: 0 5px 15px var(--shadow);
    }

    .cart-link:hover {
      color: white;
      transform: translateY(-2px);
    }

    /* ==================================================
       HERO
       ================================================== */

    .hero {
      min-height: 640px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;

      background:
        radial-gradient(circle at 15% 25%, rgba(255,239,185,0.95), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(191,221,240,0.75), transparent 25%),
        radial-gradient(circle at 75% 85%, rgba(247,188,176,0.6), transparent 28%),
        linear-gradient(135deg, #FFF8E2, #FFFDF3);
    }

    .hero::before {
      content: "✿";
      position: absolute;
      top: 70px;
      left: 8%;
      font-size: 70px;
      color: rgba(118,123,57,0.28);
      transform: rotate(-15deg);
    }

    .hero::after {
      content: "☾";
      position: absolute;
      right: 9%;
      bottom: 65px;
      font-size: 85px;
      color: rgba(200,85,85,0.35);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 70px 24px;
    }

    .moon {
      font-size: 42px;
      margin-bottom: 12px;
      color: #C8A64B;
    }

    .hero h1 {
      font-family: "Shadows Into Light Two", cursive;
      font-size: clamp(72px, 14vw, 145px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 4px;
      color: var(--brown);
    }

    .hero-script {
      font-family: "Great Vibes", cursive;
      font-size: clamp(30px, 5vw, 52px);
      color: var(--red);
      margin-top: 10px;
    }

    .hero-description {
      max-width: 620px;
      margin: 20px auto 30px;
      font-size: 17px;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 30px;
      border: 1px solid var(--brown);
      transition: 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--red);
      color: white;
      border-color: var(--red);
      box-shadow: 0 8px 20px var(--shadow);
    }

    .btn-secondary {
      background: white;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 20px var(--shadow);
    }

    /* ==================================================
       GENERAL
       ================================================== */

    section {
      padding: 80px 22px;
    }

    .section-inner {
      max-width: 1120px;
      margin: auto;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 42px;
    }

    .section-heading h2 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(42px, 7vw, 62px);
      font-weight: 400;
      color: var(--brown);
      line-height: 1.2;
    }

    .section-heading p {
      max-width: 620px;
      margin: 10px auto 0;
    }

    /* ==================================================
       CATEGORY CARDS
       ================================================== */

    .categories {
      background: white;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .category-card {
      min-height: 190px;
      padding: 25px 18px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: 0.3s ease;
      box-shadow: 0 8px 22px var(--shadow);
    }

    .category-card:nth-child(1) {
      background: var(--butter);
    }

    .category-card:nth-child(2) {
      background: var(--melon);
    }

    .category-card:nth-child(3) {
      background: var(--blue);
    }

    .category-card:nth-child(4) {
      background: #DDE2B8;
    }

    .category-card:hover {
      transform: translateY(-7px) rotate(-1deg);
    }

    .category-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .category-card h3 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    /* ==================================================
       PRODUCTS
       ================================================== */

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .product-card {
      background: white;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 9px 25px var(--shadow);
      transition: 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-7px);
    }

    .product-image {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 95px;
      background:
        radial-gradient(circle at 25% 25%, white, transparent 35%),
        var(--butter);
    }

    .product-card:nth-child(2) .product-image {
      background: var(--blue);
    }

    .product-card:nth-child(3) .product-image {
      background: var(--melon);
    }

    .product-info {
      padding: 22px;
    }

    .product-info h3 {
      font-size: 21px;
      margin-bottom: 4px;
    }

    .product-info p {
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 19px;
      font-weight: 600;
      color: var(--red);
      margin-bottom: 14px;
    }

    .product-button {
      display: block;
      text-align: center;
      padding: 10px 15px;
      border-radius: 22px;
      background: var(--green);
      color: white;
      transition: 0.25s ease;
    }

    .product-button:hover {
      transform: translateY(-2px);
      background: var(--brown);
    }

    /* ==================================================
       FEATURED STRIP
       ================================================== */

    .feature-strip {
      background: var(--brown);
      color: var(--vanilla);
      text-align: center;
      padding: 65px 22px;
    }

    .feature-strip h2 {
      font-family: "Great Vibes", cursive;
      font-size: clamp(42px, 7vw, 65px);
      font-weight: 400;
    }

    .feature-strip p {
      max-width: 700px;
      margin: 10px auto 22px;
    }

    /* ==================================================
       ABOUT
       ================================================== */

    .about {
      background: white;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .about-art {
      min-height: 400px;
      border-radius: 35px;
      background:
        radial-gradient(circle at 20% 25%, white, transparent 20%),
        radial-gradient(circle at 80% 70%, var(--melon), transparent 24%),
        linear-gradient(145deg, var(--butter), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 130px;
      box-shadow: 0 12px 30px var(--shadow);
    }

    .about-copy h2 {
      font-family: "Great Vibes", cursive;
      font-size: 60px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .about-copy p {
      margin-bottom: 15px;
    }

    /* ==================================================
       CARE
       ================================================== */

    .care {
      background: var(--butter);
    }

    .care-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .care-card {
      background: rgba(255,255,255,0.72);
      border-radius: 25px;
      padding: 28px;
      text-align: center;
    }

    .care-card .icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .care-card h3 {
      margin-bottom: 6px;
    }

    /* ==================================================
       SOCIAL
       ================================================== */

    .social {
      background: white;
      text-align: center;
    }

    .social-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 25px;
    }

    .social-button {
      padding: 13px 23px;
      border-radius: 25px;
      background: var(--melon);
      transition: 0.25s ease;
    }
