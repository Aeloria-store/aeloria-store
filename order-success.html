<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Order Received · AELORIA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at top,
          #FFF8E2 0%,
          #FFEFB9 45%,
          #FFF8E2 100%
        );

      color: #5E442E;

      font-family: Georgia, serif;
    }

    .success-box {
      width: 100%;
      max-width: 620px;

      padding: 42px 28px;

      text-align: center;

      background: rgba(255, 255, 255, 0.9);

      border-radius: 28px;

      box-shadow:
        0 18px 50px
        rgba(94, 68, 46, 0.12);
    }

    .moon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .brand {
      font-family: "Shadows Into Light Two", cursive;
      font-size: 34px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 16px;
    }

    p {
      line-height: 1.7;
      margin: 10px 0;
    }

    .order-number {
      margin: 24px 0;
      padding: 16px;

      background: #FFEFB9;

      border-radius: 16px;

      font-size: 18px;
      font-weight: bold;
    }

    .button {
      display: inline-block;

      margin-top: 22px;
      padding: 13px 24px;

      background: #C85555;
      color: white;

      text-decoration: none;

      border-radius: 14px;

      font-size: 15px;
    }

  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="success-box">

    <div class="moon">
      ☾
    </div>

    <div class="brand">
      AELORIA
    </div>

    <h1>
      Your order has been received ♡
    </h1>

    <p>
      Thank you for supporting handmade art.
    </p>

    <p>
      Your payment will be manually verified
      before your order is processed.
    </p>

    <div class="order-number">
      Order number:
      <span id="orderId">
        —
      </span>
    </div>

    <p>
      Please keep your order number for reference.
    </p>

    <a
      href="shop.html"
      class="button"
    >
      Continue Shopping
    </a>

  </div>

  <script>

    const savedOrder =
      localStorage.getItem(
        "aeloriaPendingOrder"
      );

    if (savedOrder) {

      const order =
        JSON.parse(savedOrder);

      document.getElementById(
        "orderId"
      ).textContent =
        order.orderId || "—";

    }

  </script>

</body>

</html>
