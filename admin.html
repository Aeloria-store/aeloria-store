<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AELORIA · Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #FFF8E2;
      color: #5E442E;
      font-family: Georgia, serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      text-align: center;
      font-family: "Shadows Into Light Two", cursive;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 32px;
      opacity: 0.75;
    }

    .card {
      background: white;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(94,68,46,0.10);
    }

    h2 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      opacity: 0.7;
    }

    .order {
      border: 1px solid rgba(94,68,46,0.12);
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      margin-right: 6px;
      padding: 7px 11px;
      border-radius: 10px;
      background: #FFEFB9;
    }

    .product {
      margin-top: 14px;
      padding: 12px;
      background: #FFF8E2;
      border-radius: 12px;
    }

    .total {
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      padding: 12px;
      background: #F7BCB0;
      border-radius: 12px;
    }

    .admin-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(94,68,46,0.12);
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(94,68,46,0.2);
      border-radius: 12px;
      background: #fffdf5;
      color: #5E442E;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 13px 18px;
      border: 0;
      border-radius: 14px;
      background: #C85555;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .save-message {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <div class="container">
<div class="card">

  <h2>Products</h2>

<button onclick="addCategory()">
  ＋ Add Category
</button>

<div id="productCategories">
    <div class="empty">
      Loading categories...
    </div>
  </div>
<div id="productList">
  <div class="empty">
    Loading products...
  </div>
</div>
</div>
    <div class="brand">AELORIA</div>

    <div class="subtitle">
      Handmade Shop · Admin
    </div>

    <div class="card">

      <h2>Orders</h2>

      <div id="orders">
        <div class="empty">
          Loading orders...
        </div>
      </div>

    </div>

  </div>


<script>

let adminPassword = "";
  let currentCategoryId = null;
  function openCategory(categoryId, categoryName) {

  const box =
    document.getElementById("productCategories");

  box.innerHTML = `

    <div
      style="
        margin-top:16px;
        padding:20px;
        border-radius:16px;
        background:#FFF8E2;
      "
    >

      <button
        type="button"
        onclick="loadProductCategories()"
      >
        ← Back to Categories
      </button>

            <h3>
        ${categoryName}
      </h3>

      <div id="categoryProducts">
        <div class="empty">
          Loading products...
        </div>
      </div>

      <button
        onclick="addProduct(${categoryId}, '${categoryName}')"
      >
        ＋ Add Product
      </button>

    </div>

    `;

  loadCategoryProducts(categoryId);

}
  function addProduct(categoryId, categoryName) {
currentCategoryId = categoryId;
  const box =
    document.getElementById("productCategories");

  box.innerHTML = `

    <div
  style="
    margin-top:16px;
    padding:20px;
    border-radius:16px;
    background:#FFF8E2;
  "
>

  <button
    type="button"
    onclick="openCategory(${categoryId}, '${categoryName}')"
  >
    ← Back to Category
  </button>

  <h3>
    Add Product
  </h3>

      <p>
        Category:
        <strong>${categoryName}</strong>
      </p>
<label>
  Product Name
</label>

<input
  id="productName"
  type="text"
  placeholder="Enter product name"
>
<label>
  Description
</label>

<textarea
  id="productDescription"
  placeholder="Describe your product..."
></textarea>
<label>
  Price (₹)
</label>

<input
  id="productPrice"
  type="number"
  min="0"
  placeholder="Enter price"
>
<label>
  Sale Price (₹)
</label>

<input
  id="productSalePrice"
  type="number"
  min="0"
  placeholder="Leave blank if no sale"
>
<label>
  Stock
</label>

<input
  id="productStock"
  type="number"
  min="0"
  placeholder="Enter stock quantity"
>
<label>
  Product Image URL
</label>

<input
  id="productImageUrl"
  type="url"
  placeholder="Paste product image URL here"
>
<label>
  Size
</label>

<input
  id="productSize"
  type="text"
  placeholder="e.g. 5 cm"
>
<label>
  Fulfillment
</label>

<select id="productFulfillment">
  <option value="made_to_order">
    Made to Order
  </option>

  <option value="ready_to_ship">
    Ready to Ship
  </option>
</select>
<label>
  <input
    id="customerNoteEnabled"
    type="checkbox"
  >
  Allow customer note
</label>
<label>
  <input
    id="productBestseller"
    type="checkbox"
  >
  Mark as Bestseller
</label>
<label>
  <input
    id="productNewArrival"
    type="checkbox"
  >
  Mark as New Arrival
</label>
<label>
  <input
    id="productVisible"
    type="checkbox"
    checked
  >
  Show product in store
</label>
<button
  type="button"
  onclick="saveProduct()"
>
  Save Product
</button>
        </div>

    `;

}
  async function loadCategoryProducts(categoryId) {

  try {

    const response =
      await fetch(
        "/api/admin/products",
        {
          headers: {
            "Authorization":
              "Bearer " + adminPassword
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Could not load products"
      );
    }

    const categoryProducts =
      data.products.filter(
        product =>
          product.category_id === categoryId
      );

    const box =
      document.getElementById("categoryProducts");

    if (
      !categoryProducts ||
      categoryProducts.length === 0
    ) {

      box.innerHTML =
        `<div class="empty">
          No products in this category yet.
        </div>`;

      return;
    }

    box.innerHTML =
      categoryProducts.map(product => `

        <div
          style="
            margin-top:12px;
            padding:16px;
            border-radius:16px;
            background:white;
          "
        >

          <strong>
            ${product.name}
          </strong>

          <br>

          Price:
          ₹${product.sale_price || product.price}

          <br>

          Stock:
          ${product.stock}

        </div>

      `).join("");

  } catch (error) {

    const box =
      document.getElementById("categoryProducts");

    box.innerHTML =
      `<div class="empty">
        Could not load category products.
      </div>`;

  }

}
  async function saveProduct() {

  const categoryId = currentCategoryId;

  const productName =
    document.getElementById("productName").value.trim();

  const description =
    document.getElementById("productDescription").value.trim();

  const price =
    Number(document.getElementById("productPrice").value);

  const salePriceValue =
    document.getElementById("productSalePrice").value;

  const salePrice =
    salePriceValue
      ? Number(salePriceValue)
      : null;

  const stock =
    Number(document.getElementById("productStock").value);

  const imageUrl =
    document.getElementById("productImageUrl").value.trim();

  const size =
    document.getElementById("productSize").value.trim();
    const fulfillment =
  document.getElementById("productFulfillment").value;

const customerNoteEnabled =
  document.getElementById("customerNoteEnabled").checked;

const isBestseller =
  document.getElementById("productBestseller").checked;

const isNewArrival =
  document.getElementById("productNewArrival").checked;

const isVisible =
  document.getElementById("productVisible").checked;
    if (!productName || !price || !stock) {

  alert(
    "Please enter Product Name, Price, and Stock."
  );

  return;
}
    const response =
  await fetch("/api/admin/products", {

    method: "POST",

    headers: {
  "Content-Type": "application/json",
  "Authorization":
    "Bearer " + adminPassword
},

body: JSON.stringify({
  categoryId: categoryId,
  name: productName,
  description: description,
  price: price,
  salePrice: salePrice,
  stock: stock,
  imageUrl: imageUrl,
  size: size,
  madeToOrder: fulfillment === "made_to_order",
  customerNoteEnabled: customerNoteEnabled,
  isBestseller: isBestseller,
  isNewArrival: isNewArrival,
  isVisible: isVisible
})

  });
    const data =
  await response.json();

if (!response.ok || !data.success) {

  throw new Error(
    data.error || "Could not save product"
  );

}

alert(
  "Product saved successfully! ❤️"
);
alert(
  "Product details collected successfully!"
);
}
  async function addCategory() {

  const categoryName =
    prompt("Enter new category name:");

  if (!categoryName) {
    return;
  }

  try {

    const response =
      await fetch(
        "/api/admin/categories",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + adminPassword
          },

          body: JSON.stringify({
            name: categoryName
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Could not create category"
      );
    }

    alert(
      "Category created successfully!"
    );

    loadProductCategories();

  } catch (error) {

    alert(
      "Could not create category."
    );

  }

}
async function loadProductCategories() {

  const box =
    document.getElementById("productCategories");

  try {

    const response =
      await fetch(
        "/api/admin/categories",
        {
          headers: {
            "Authorization":
              "Bearer " + adminPassword
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Could not load categories"
      );
    }

    box.innerHTML =
  data.categories.map(category => `

    <div
      onclick="openCategory(${category.id}, '${category.name}')"
      style="
        margin-top:12px;
        padding:16px;
        border-radius:16px;
        background:#FFF8E2;
        cursor:pointer;
      "
    >

      <strong>
        ${category.name}
      </strong>

    </div>

  `).join("");

  } catch (error) {

    box.innerHTML =
      `<div class="empty">
        Could not load product categories.
      </div>`;

  }
}

async function loadOrders() {

  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML =
    `<div class="empty">Loading orders...</div>`;

  adminPassword =
    prompt("Enter AELORIA Admin Password:");

  if (!adminPassword) {
    ordersBox.innerHTML =
      `<div class="empty">Admin password required.</div>`;
    return;
  }

  try {

    const response = await fetch(
      "/api/admin/orders",
      {
        headers: {
          "Authorization":
            "Bearer " + adminPassword
        }
      }
    );

    if (!response.ok) {
      throw new Error("Unauthorized");
    }

    const data =
      await response.json();

    if (
      !data.orders ||
      data.orders.length === 0
    ) {

      ordersBox.innerHTML =
        `<div class="empty">
          No orders found yet.
        </div>`;

      return;
    }


    ordersBox.innerHTML =
      data.orders.map(order => {

        const customer =
          JSON.parse(order.customer_json);

        const products =
          JSON.parse(order.products_json);


        return `

          <div class="order">

            <div class="order-id">
              ${order.order_id}
            </div>


            <div class="status">
              Payment:
              <strong>
                ${order.payment_status}
              </strong>
            </div>


            <div class="status">
              Order:
              <strong>
                ${order.order_status}
              </strong>
            </div>


            <p>
              <strong>Customer:</strong>
              ${customer.name}
            </p>


            <p>
              <strong>Mobile:</strong>
              ${customer.mobile}
            </p>


            <p>
              <strong>Email:</strong>
              ${customer.email}
            </p>


            <p>
              <strong>Total:</strong>
              ₹${order.total}
            </p>


            <div class="product">

              <strong>Products:</strong>

              <br><br>

              ${
                products
                  .map(
                    item =>
                      `${item.name} × ${item.quantity || 1}`
                  )
                  .join("<br>")
              }

            </div>


            <div class="admin-section">

              <h3>
                Manage Order
              </h3>


              <label>
                Payment Status
              </label>

              <select
                id="payment-${order.order_id}"
              >

                <option
                  value="Pending Verification"
                  ${order.payment_status === "Pending Verification" ? "selected" : ""}
                >
                  Pending Verification
                </option>

                <option
                  value="Payment Verified"
                  ${order.payment_status === "Payment Verified" ? "selected" : ""}
                >
                  Payment Verified
                </option>

                <option
                  value="Payment Failed"
                  ${order.payment_status === "Payment Failed" ? "selected" : ""}
                >
                  Payment Failed
                </option>

              </select>


              <label>
                Order Status
              </label>

              <select
                id="status-${order.order_id}"
              >

                <option
                  value="Pending Payment"
                  ${order.order_status === "Pending Payment" ? "selected" : ""}
                >
                  Pending Payment
                </option>

                <option
                  value="Processing"
                  ${order.order_status === "Processing" ? "selected" : ""}
                >
                  Processing
                </option>

                <option
                  value="Shipped"
                  ${order.order_status === "Shipped" ? "selected" : ""}
                >
                  Shipped
                </option>

                <option
                  value="Delivered"
                  ${order.order_status === "Delivered" ? "selected" : ""}
                >
                  Delivered
                </option>

                <option
                  value="Cancelled"
                  ${order.order_status === "Cancelled" ? "selected" : ""}
                >
                  Cancelled
                </option>

              </select>


              <label>
                Courier
              </label>

              <input
                id="courier-${order.order_id}"
                value="${order.courier || ""}"
                placeholder="India Post / DTDC"
              >


              <label>
                Tracking Number
              </label>

              <input
                id="tracking-${order.order_id}"
                value="${order.tracking_number || ""}"
                placeholder="Enter tracking number"
              >


              <label>
                Admin Notes
              </label>

              <textarea
                id="notes-${order.order_id}"
                placeholder="Private admin notes..."
              >${order.admin_notes || ""}</textarea>


              <button
                onclick="saveOrder('${order.order_id}')"
              >
                Save Changes
              </button>


              <div
                id="message-${order.order_id}"
                class="save-message"
              ></div>

            </div>

          </div>

        `;

      }).join("");


  } catch (error) {

    ordersBox.innerHTML = `
      <div class="empty">

        Could not load orders.

        <br><br>

        Please check your Admin password.

      </div>
    `;

  }

}


async function saveOrder(orderId) {

  const message =
    document.getElementById(
      "message-" + orderId
    );


  const paymentStatus =
    document.getElementById(
      "payment-" + orderId
    ).value;


  const orderStatus =
    document.getElementById(
      "status-" + orderId
    ).value;


  const courier =
    document.getElementById(
      "courier-" + orderId
    ).value;


  const trackingNumber =
    document.getElementById(
      "tracking-" + orderId
    ).value;


  const adminNotes =
    document.getElementById(
      "notes-" + orderId
    ).value;


  message.textContent =
    "Saving...";


  try {

    const response =
      await fetch(
        "/api/admin/orders",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + adminPassword
          },

          body: JSON.stringify({

            orderId,

            paymentStatus,

            orderStatus,

            courier,

            trackingNumber,

            adminNotes

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Update failed"
      );

    }


    message.textContent =
      "✓ Saved successfully";


    setTimeout(() => {

      message.textContent = "";

    }, 2500);


  } catch (error) {

    message.textContent =
      "Could not save changes.";

  }

}
async function loadProducts() {

  const box =
    document.getElementById("productList");

  try {

    const response =
      await fetch(
        "/api/admin/products",
        {
          headers: {
            "Authorization":
              "Bearer " + adminPassword
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "Could not load products"
      );
    }

    if (
      !data.products ||
      data.products.length === 0
    ) {

      box.innerHTML =
        `<div class="empty">
          No products found yet.
        </div>`;

      return;
    }

    box.innerHTML =
      data.products.map(product => `

        <div
          style="
            margin-top:12px;
            padding:16px;
            border-radius:16px;
            background:#FFF8E2;
          "
        >

          <strong>
            ${product.name}
          </strong>

          <br>

          Category:
          ${product.category_name}

          <br>

          Price:
          ₹${product.sale_price || product.price}

          <br>

          Stock:
          ${product.stock}

        </div>

      `).join("");

  } catch (error) {

    box.innerHTML =
      `<div class="empty">
        Could not load products.
      </div>`;

  }

}

loadOrders();
loadProductCategories();
loadProducts();
</script>

</body>
</html>
