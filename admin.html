<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AELORIA · Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;

      background: #FFF8E2;
      color: #5E442E;

      font-family: Georgia, serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      text-align: center;

      font-family:
        "Shadows Into Light Two",
        cursive;

      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 32px;
      opacity: 0.75;
    }

    .card {
      background: white;

      padding: 24px;
      margin-bottom: 20px;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(94, 68, 46, 0.10);
    }

    h2 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      opacity: 0.7;
    }

    .order {
      border: 1px solid
        rgba(94, 68, 46, 0.12);

      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;

      margin-top: 8px;
      padding: 7px 11px;

      border-radius: 10px;

      background: #FFEFB9;
    }

    .product {
      margin-top: 14px;
      padding: 12px;

      background: #FFF8E2;
      border-radius: 12px;
    }

    .total {
      margin-top: 14px;

      font-size: 18px;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      padding: 12px;

      background: #F7BCB0;
      border-radius: 12px;
    }

  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

    <div class="brand">
      AELORIA
    </div>

    <div class="subtitle">
      Handmade Shop · Admin
    </div>

    <div class="card">

      <h2>
        Orders
      </h2>

      <div id="orders">

        <div class="empty">
          No orders found yet.
        </div>

      </div>

    </div>

  </div>
<script>

  const ordersBox =
    document.getElementById("orders");

  let savedOrders =
  JSON.parse(
    localStorage.getItem("aeloriaOrders") || "[]"
  );

if (
  savedOrders.length === 0
) {

  const oldOrder =
    localStorage.getItem(
      "aeloriaPendingOrder"
    );

  if (oldOrder) {

    savedOrders = [
      JSON.parse(oldOrder)
    ];

    localStorage.setItem(
      "aeloriaOrders",
      JSON.stringify(savedOrders)
    );

  }

}

const savedOrder =
  savedOrders.length > 0
    ? JSON.stringify(
        savedOrders[savedOrders.length - 1]
      )
    : localStorage.getItem(
        "aeloriaPendingOrder"
      );

  if (!savedOrder) {

    ordersBox.innerHTML = `
      <div class="empty">
        No orders found yet.
      </div>
    `;

  } else {

    const order =
      JSON.parse(savedOrder);

    const products =
      order.products || [];

    ordersBox.innerHTML = `

      <div class="order">

        <div class="order-id">
          ${order.orderId}
        </div>

        <div class="status">
  Payment:
  <strong>${order.paymentStatus}</strong>
</div>

<select
  id="paymentStatus"
  style="
    margin-top:10px;
    padding:9px;
    border-radius:10px;
    border:1px solid #ddd;
    font-family:inherit;
  "
>

  <option
    value="Pending Verification"
    ${order.paymentStatus === "Pending Verification" ? "selected" : ""}
  >
    Pending Verification
  </option>

  <option
    value="Payment Verified"
    ${order.paymentStatus === "Payment Verified" ? "selected" : ""}
  >
    Payment Verified
  </option>

  <option
    value="Payment Failed"
    ${order.paymentStatus === "Payment Failed" ? "selected" : ""}
  >
    Payment Failed
  </option>

</select>

<button
  onclick="updatePaymentStatus()"
  style="
    display:block;
    margin-top:10px;
    padding:9px 14px;
    border:0;
    border-radius:10px;
    background:#FFEFB9;
    color:#5E442E;
    font-family:inherit;
    cursor:pointer;
  "
>
  Save Payment Status
</button>
<div style="margin-top:18px;">

  <div class="status">
    Order:
    <strong>${order.orderStatus || "Pending Payment"}</strong>
  </div>

  <select
    id="orderStatus"
    style="
      margin-top:10px;
      padding:9px;
      border-radius:10px;
      border:1px solid #ddd;
      font-family:inherit;
    "
  >

    <option
      value="Pending Payment"
      ${(order.orderStatus || "Pending Payment") === "Pending Payment" ? "selected" : ""}
    >
      Pending Payment
    </option>

    <option
      value="Processing"
      ${order.orderStatus === "Processing" ? "selected" : ""}
    >
      Processing
    </option>

    <option
      value="Shipped"
      ${order.orderStatus === "Shipped" ? "selected" : ""}
    >
      Shipped
    </option>

    <option
      value="Delivered"
      ${order.orderStatus === "Delivered" ? "selected" : ""}
    >
      Delivered
    </option>

  </select>

  <button
    onclick="updateOrderStatus()"
    style="
      display:block;
      margin-top:10px;
      padding:9px 14px;
      border:0;
      border-radius:10px;
      background:#F7BCB0;
      color:#5E442E;
      font-family:inherit;
      cursor:pointer;
    "
  >
    Save Order Status
  </button>

</div>
        <p>
          <strong>Customer</strong><br>
          ${order.customer.name}<br>
          ${order.customer.mobile}<br>
          ${order.customer.email}
        </p>

        <p>
          <strong>Address</strong><br>
          ${order.customer.house},
          ${order.customer.street}<br>
          ${order.customer.city},
          ${order.customer.state}
          ${order.customer.pincode}
        </p>

        ${products.map(item => `

          <div class="product">

            <strong>
              ${item.name}
            </strong>

            <br>

            Quantity:
            ${item.quantity || 1}

            <br>

            ₹${item.price * (item.quantity || 1)}

          </div>

        `).join("")}

        <div class="total">
          Total: ₹${order.total}
        </div>
<div style="margin-top:16px;">

  <strong>
    Admin Notes
  </strong>

  <textarea
    id="adminNotes"
    placeholder="Add a private note about this order..."
    style="
      display:block;
      width:100%;
      min-height:90px;
      margin-top:8px;
      padding:10px;
      border:1px solid #ddd;
      border-radius:12px;
      font-family:inherit;
      resize:vertical;
    "
  >${order.adminNotes || ""}</textarea>

  <button
    onclick="saveAdminNotes()"
    style="
      margin-top:10px;
      padding:9px 14px;
      border:0;
      border-radius:10px;
      background:#FFEFB9;
      color:#5E442E;
      font-family:inherit;
      cursor:pointer;
    "
  >
    Save Note
  </button>

</div>

        <div style="margin-top:16px;">

          <strong>
            Shipping
          </strong>

          <select
            id="courier"
            style="
              display:block;
              width:100%;
              margin-top:8px;
              padding:10px;
              border:1px solid #ddd;
              border-radius:10px;
              font-family:inherit;
            "
          >

            <option value="">
              Select Courier
            </option>

            <option
              value="India Post"
              ${order.courier === "India Post" ? "selected" : ""}
            >
              India Post
            </option>

            <option
              value="DTDC"
              ${order.courier === "DTDC" ? "selected" : ""}
            >
              DTDC
            </option>

          </select>

          <input
            id="trackingNumber"
            type="text"
            value="${order.trackingNumber || ""}"
            placeholder="Enter tracking number"
            style="
              display:block;
              width:100%;
              margin-top:8px;
              padding:10px;
              border:1px solid #ddd;
              border-radius:10px;
              font-family:inherit;
            "
          >

          <button
            onclick="saveShipping()"
            style="
              margin-top:10px;
              padding:9px 14px;
              border:0;
              border-radius:10px;
              background:#F7BCB0;
              color:#5E442E;
              font-family:inherit;
              cursor:pointer;
            "
          >
            Save Shipping Details
          </button>

        </div>

        <div class="note">

          <strong>
            UPI Transaction ID:
          </strong>

          <br>

          ${order.transactionId || "Not provided"}

        </div>

      </div>

    `;

  }
function updatePaymentStatus() {

  const savedOrder =
    localStorage.getItem(
      "aeloriaPendingOrder"
    );

  if (!savedOrder) {
    return;
  }

  const order =
    JSON.parse(savedOrder);

  const newStatus =
    document.getElementById(
      "paymentStatus"
    ).value;

  order.paymentStatus =
    newStatus;

  localStorage.setItem(
    "aeloriaPendingOrder",
    JSON.stringify(order)
  );

    location.reload();

}

function updateOrderStatus() {

  const savedOrder =
    localStorage.getItem(
      "aeloriaPendingOrder"
    );

  if (!savedOrder) {
    return;


  const ordersBox =
    document.getElementById("orders");

  const savedOrders =
    JSON.parse(
      localStorage.getItem("aeloriaOrders") || "[]"
    );

  if (savedOrders.length === 0) {

    ordersBox.innerHTML = `
      <div class="empty">
        No orders found yet.
      </div>
    `;

  } else {

    ordersBox.innerHTML =
      savedOrders
        .slice()
        .reverse()
        .map((order) => {

          const products =
            order.products || [];

          return `

            <div
              class="order"
              data-order-id="${order.orderId}"
            >

              <div class="order-id">
                ${order.orderId}
              </div>

              <div class="status">
                Payment:
                <strong>
                  ${order.paymentStatus || "Pending Verification"}
                </strong>
              </div>

              <select
                id="paymentStatus-${order.orderId}"
                style="
                  margin-top:10px;
                  padding:9px;
                  border-radius:10px;
                  border:1px solid #ddd;
                  font-family:inherit;
                "
              >

                <option
                  value="Pending Verification"
                  ${order.paymentStatus === "Pending Verification" ? "selected" : ""}
                >
                  Pending Verification
                </option>

                <option
                  value="Payment Verified"
                  ${order.paymentStatus === "Payment Verified" ? "selected" : ""}
                >
                  Payment Verified
                </option>

                <option
                  value="Payment Failed"
                  ${order.paymentStatus === "Payment Failed" ? "selected" : ""}
                >
                  Payment Failed
                </option>

              </select>

              <button
                onclick="updatePaymentStatus('${order.orderId}')"
                style="
                  display:block;
                  margin-top:10px;
                  padding:9px 14px;
                  border:0;
                  border-radius:10px;
                  background:#FFEFB9;
                  color:#5E442E;
                  font-family:inherit;
                  cursor:pointer;
                "
              >
                Save Payment Status
              </button>


              <div style="margin-top:18px;">

                <div class="status">
                  Order:
                  <strong>
                    ${order.orderStatus || "Pending Payment"}
                  </strong>
                </div>

                <select
                  id="orderStatus-${order.orderId}"
                  style="
                    margin-top:10px;
                    padding:9px;
                    border-radius:10px;
                    border:1px solid #ddd;
                    font-family:inherit;
                  "
                >

                  <option
                    value="Pending Payment"
                    ${order.orderStatus === "Pending Payment" ? "selected" : ""}
                  >
                    Pending Payment
                  </option>

                  <option
                    value="Processing"
                    ${order.orderStatus === "Processing" ? "selected" : ""}
                  >
                    Processing
                  </option>

                  <option
                    value="Shipped"
                    ${order.orderStatus === "Shipped" ? "selected" : ""}
                  >
                    Shipped
                  </option>

                  <option
                    value="Delivered"
                    ${order.orderStatus === "Delivered" ? "selected" : ""}
                  >
                    Delivered
                  </option>

                </select>

                <button
                  onclick="updateOrderStatus('${order.orderId}')"
                  style="
                    display:block;
                    margin-top:10px;
                    padding:9px 14px;
                    border:0;
                    border-radius:10px;
                    background:#FFEFB9;
                    color:#5E442E;
                    font-family:inherit;
                    cursor:pointer;
                  "
                >
                  Save Order Status
                </button>

              </div>


              <div style="margin-top:20px;">

                <strong>
                  Customer
                </strong>

                <p>
                  ${order.customer?.name || ""}
                </p>

                <p>
                  ${order.customer?.mobile || ""}
                </p>

                <p>
                  ${order.customer?.email || ""}
                </p>

                <p>
                  ${order.customer?.address || ""}
                </p>

              </div>


              <div style="margin-top:20px;">

                <strong>
                  Products
                </strong>

                ${
                  products.length
                    ? products.map(item => `
                        <div
                          style="
                            margin-top:10px;
                            padding:12px;
                            background:#FFF8E2;
                            border-radius:10px;
                          "
                        >
                          <strong>
                            ${item.name}
                          </strong>

                          <div>
                            Quantity:
                            ${item.quantity || 1}
                          </div>

                          <div>
                            ₹${item.price * (item.quantity || 1)}
                          </div>
                        </div>
                      `).join("")
                    : "<p>No product details found.</p>"
                }

              </div>


              <div class="total">
                Total: ₹${order.total}
              </div>


              <div style="margin-top:20px;">

                <strong>
                  Admin Notes
                </strong>

                <textarea
                  id="adminNotes-${order.orderId}"
                  placeholder="Private note about this order"
                  style="
                    display:block;
                    width:100%;
                    min-height:90px;
                    margin-top:8px;
                    padding:10px;
                    border:1px solid #ddd;
                    border-radius:10px;
                    font-family:inherit;
                    box-sizing:border-box;
                  "
                >${order.adminNotes || ""}</textarea>

                <button
                  onclick="saveAdminNotes('${order.orderId}')"
                  style="
                    margin-top:10px;
                    padding:9px 14px;
                    border:0;
                    border-radius:10px;
                    background:#FFEFB9;
                    color:#5E442E;
                    font-family:inherit;
                    cursor:pointer;
                  "
                >
                  Save Note
                </button>

              </div>


              <div style="margin-top:20px;">

                <strong>
                  Shipping
                </strong>

                <select
                  id="courier-${order.orderId}"
                  style="
                    display:block;
                    width:100%;
                    margin-top:8px;
                    padding:10px;
                    border:1px solid #ddd;
                    border-radius:10px;
                    font-family:inherit;
                  "
                >

                  <option value="">
                    Select Courier
                  </option>

                  <option
                    value="India Post"
                    ${order.courier === "India Post" ? "selected" : ""}
                  >
                    India Post
                  </option>

                  <option
                    value="DTDC"
                    ${order.courier === "DTDC" ? "selected" : ""}
                  >
                    DTDC
                  </option>

                </select>


                <input
                  id="trackingNumber-${order.orderId}"
                  type="text"
                  value="${order.trackingNumber || ""}"
                  placeholder="Enter tracking number"
                  style="
                    display:block;
                    width:100%;
                    margin-top:8px;
                    padding:10px;
                    border:1px solid #ddd;
                    border-radius:10px;
                    font-family:inherit;
                    box-sizing:border-box;
                  "
                >


                <button
                  onclick="saveShipping('${order.orderId}')"
                  style="
                    margin-top:10px;
                    padding:9px 14px;
                    border:0;
                    border-radius:10px;
                    background:#F7BCB0;
                    color:#5E442E;
                    font-family:inherit;
                    cursor:pointer;
                  "
                >
                  Save Shipping Details
                </button>

              </div>


              <div class="note">

                <strong>
                  UPI Transaction ID:
                </strong>

                <br>

                ${order.transactionId || "Not provided"}

              </div>

            </div>

          `;

        })
        .join("");

  }


  function getOrders() {

    return JSON.parse(
      localStorage.getItem("aeloriaOrders") || "[]"
    );

  }


  function saveOrders(orders) {

    localStorage.setItem(
      "aeloriaOrders",
      JSON.stringify(orders)
    );

  }


  function updatePaymentStatus(orderId) {

    const orders =
      getOrders();

    const order =
      orders.find(
        item => item.orderId === orderId
      );

    if (!order) {
      return;
    }

    const newStatus =
      document.getElementById(
        `paymentStatus-${orderId}`
      ).value;

    order.paymentStatus =
      newStatus;

    saveOrders(orders);

    localStorage.setItem(
      "aeloriaPendingOrder",
      JSON.stringify(order)
    );

    location.reload();

  }


  function updateOrderStatus(orderId) {

    const orders =
      getOrders();

    const order =
      orders.find(
        item => item.orderId === orderId
      );

    if (!order) {
      return;
    }

    const newStatus =
      document.getElementById(
        `orderStatus-${orderId}`
      ).value;

    order.orderStatus =
      newStatus;

    saveOrders(orders);

    localStorage.setItem(
      "aeloriaPendingOrder",
      JSON.stringify(order)
    );

    location.reload();

  }


  function saveAdminNotes(orderId) {

    const orders =
      getOrders();

    const order =
      orders.find(
        item => item.orderId === orderId
      );

    if (!order) {
      return;
    }

    const notes =
      document.getElementById(
        `adminNotes-${orderId}`
      ).value;

    order.adminNotes =
      notes;

    saveOrders(orders);

    localStorage.setItem(
      "aeloriaPendingOrder",
      JSON.stringify(order)
    );

    location.reload();

  }


  function saveShipping(orderId) {

    const orders =
      getOrders();

    const order =
      orders.find(
        item => item.orderId === orderId
      );

    if (!order) {
      return;
    }

    const courier =
      document.getElementById(
        `courier-${orderId}`
      ).value;

    const trackingNumber =
      document.getElementById(
        `trackingNumber-${orderId}`
      ).value;

    order.courier =
      courier;

    order.trackingNumber =
      trackingNumber;

    saveOrders(orders);

    localStorage.setItem(
      "aeloriaPendingOrder",
      JSON.stringify(order)
    );

    location.reload();

  }
async function loadOrders() {
  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML = `
    <div class="empty">
      Loading orders...
    </div>
  `;

  try {
    const response =
      await fetch("/api/admin/orders");

    if (!response.ok) {
      throw new Error("Could not load orders");
    }

    const data = await response.json();

    if (!data.orders || data.orders.length === 0) {
      ordersBox.innerHTML = `
        <div class="empty">
          No orders found yet.
        </div>
      `;
      return;
    }

    ordersBox.innerHTML =
      data.orders
        .map(order => `
          <div class="order-card">
            <h3>${order.order_id}</h3>
            <p><strong>Total:</strong> ₹${order.total}</p>
            <p><strong>Payment:</strong> ${order.payment_status}</p>
            <p><strong>Status:</strong> ${order.order_status}</p>
            <p><strong>Created:</strong> ${order.created_at}</p>
          </div>
        `)
        .join("");

  } catch (error) {
    ordersBox.innerHTML = `
      <div class="empty">
        Could not load orders.
      </div>
    `;
  }
}

loadOrders();
</script>
</body>

</html>
