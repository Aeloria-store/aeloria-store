<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AELORIA · Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;

      background: #FFF8E2;
      color: #5E442E;

      font-family: Georgia, serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      text-align: center;

      font-family:
        "Shadows Into Light Two",
        cursive;

      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 32px;
      opacity: 0.75;
    }

    .card {
      background: white;

      padding: 24px;
      margin-bottom: 20px;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(94, 68, 46, 0.10);
    }

    h2 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      opacity: 0.7;
    }

    .order {
      border: 1px solid
        rgba(94, 68, 46, 0.12);

      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;

      margin-top: 8px;
      padding: 7px 11px;

      border-radius: 10px;

      background: #FFEFB9;
    }

    .product {
      margin-top: 14px;
      padding: 12px;

      background: #FFF8E2;
      border-radius: 12px;
    }

    .total {
      margin-top: 14px;

      font-size: 18px;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      padding: 12px;

      background: #F7BCB0;
      border-radius: 12px;
    }

  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

    <div class="brand">
      AELORIA
    </div>

    <div class="subtitle">
      Handmade Shop · Admin
    </div>

    <div class="card">

      <h2>
        Orders
      </h2>

      <div id="orders">

        <div class="empty">
          No orders found yet.
        </div>

      </div>

    </div>

  </div>
<script>

  const ordersBox =
    document.getElementById("orders");

  const savedOrder =
    localStorage.getItem(
      "aeloriaPendingOrder"
    );

  if (!savedOrder) {

    ordersBox.innerHTML = `
      <div class="empty">
        No orders found yet.
      </div>
    `;

  } else {

    const order =
      JSON.parse(savedOrder);

    const products =
      order.products || [];

    ordersBox.innerHTML = `

      <div class="order">

        <div class="order-id">
          ${order.orderId}
        </div>

        <div class="status">
          ${order.paymentStatus}
        </div>

        <p>
          <strong>Customer</strong><br>
          ${order.customer.name}<br>
          ${order.customer.mobile}<br>
          ${order.customer.email}
        </p>

        <p>
          <strong>Address</strong><br>
          ${order.customer.house},
          ${order.customer.street}<br>
          ${order.customer.city},
          ${order.customer.state}
          ${order.customer.pincode}
        </p>

        ${products.map(item => `

          <div class="product">

            <strong>
              ${item.name}
            </strong>

            <br>

            Quantity:
            ${item.quantity || 1}

            <br>

            ₹${item.price * (item.quantity || 1)}

          </div>

        `).join("")}

        <div class="total">
          Total: ₹${order.total}
        </div>

        <div class="note">

          <strong>
            UPI Transaction ID:
          </strong>

          <br>

          ${order.transactionId || "Not provided"}

        </div>

      </div>

    `;

  }

</script>
</body>

</html>
