<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AELORIA · Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;

      background: #FFF8E2;
      color: #5E442E;

      font-family: Georgia, serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      text-align: center;

      font-family:
        "Shadows Into Light Two",
        cursive;

      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 32px;
      opacity: 0.75;
    }

    .card {
      background: white;

      padding: 24px;
      margin-bottom: 20px;

      border-radius: 22px;

      box-shadow:
        0 12px 35px
        rgba(94, 68, 46, 0.10);
    }

    h2 {
      margin-top: 0;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      opacity: 0.7;
    }

    .order {
      border: 1px solid
        rgba(94, 68, 46, 0.12);

      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      display: inline-block;

      margin-top: 8px;
      padding: 7px 11px;

      border-radius: 10px;

      background: #FFEFB9;
    }

    .product {
      margin-top: 14px;
      padding: 12px;

      background: #FFF8E2;
      border-radius: 12px;
    }

    .total {
      margin-top: 14px;

      font-size: 18px;
      font-weight: bold;
    }

    .note {
      margin-top: 12px;
      padding: 12px;

      background: #F7BCB0;
      border-radius: 12px;
    }

  </style>

  <link
    href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light+Two&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="container">

    <div class="brand">
      AELORIA
    </div>

    <div class="subtitle">
      Handmade Shop · Admin
    </div>

    <div class="card">

      <h2>
        Orders
      </h2>

      <div id="orders">

        <div class="empty">
          No orders found yet.
        </div>

      </div>

    </div>

  </div>

<script>
async function loadOrders() {

  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML = `
    <div class="empty">
      Loading orders...
    </div>
  `;

  const password =
    prompt("Enter AELORIA Admin Password:");

  if (!password) {
    return;
  }

  try {

    const response =
      await fetch("/api/admin/orders", {
        headers: {
          "Authorization":
            "Bearer " + password
        }
      });

    if (!response.ok) {
      throw new Error("Unauthorized");
    }

    const data =
      await response.json();

    if (
      !data.orders ||
      data.orders.length === 0
    ) {
      ordersBox.innerHTML = `
        <div class="empty">
          No orders found yet.
        </div>
      `;
      return;
    }

    ordersBox.innerHTML =
      data.orders.map(order => {

        const customer =
          JSON.parse(order.customer_json);

        const products =
          JSON.parse(order.products_json);

        return `
          <div class="order">

            <div class="order-id">
              ${order.order_id}
            </div>

            <div class="status">
              Payment:
              <strong>
                ${order.payment_status}
              </strong>
            </div>

            <div class="status">
              Order:
              <strong>
                ${order.order_status}
              </strong>
            </div>

            <p>
              <strong>Customer:</strong>
              ${customer.name}
            </p>

            <p>
              <strong>Mobile:</strong>
              ${customer.mobile}
            </p>

            <p>
              <strong>Email:</strong>
              ${customer.email}
            </p>

            <p>
              <strong>Total:</strong>
              ₹${order.total}
            </p>

            <p>
              <strong>Products:</strong>
              ${products.map(item =>
                `${item.name} × ${item.quantity || 1}`
              ).join("<br>")}
            </p>

          </div>
        `;

      }).join("");

  } catch (error) {

    ordersBox.innerHTML = `
      <div class="empty">
        Could not load orders.
        <br><br>
        Please check your Admin password.
      </div>
    `;

  }
}

loadOrders();
</script>
</body>

</html>
