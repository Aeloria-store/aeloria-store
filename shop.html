<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AELORIA | Shop</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Schoolbell&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">

  <style>
    :root {
      --vanilla: #FFF8E2;
      --butter: #FFEFB9;
      --brown: #5E442E;
      --pomegranate: #C85555;
      --bistre: #767B39;
      --melon: #F7BCB0;
      --sky: #DDEEF5;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  background: var(--vanilla);
  color: var(--brown);
  font-family: "Schoolbell", cursive;
}

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      text-align: center;
      padding: 28px 20px 18px;
      background: var(--white);
      border-bottom: 1px solid rgba(94, 68, 46, 0.08);
    }

    .logo {
      font-family: "Shadows Into Light Two", cursive;
      font-size: 58px;
      line-height: 1;
      letter-spacing: 3px;
    }

    .tagline {
      margin-top: 6px;
      font-size: 13px;
      font-style: italic;
    }

    nav {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 14px;
    }

    nav a:hover {
      color: var(--pomegranate);
    }

    .shop {
      max-width: 1100px;
      margin: auto;
      padding: 55px 20px 80px;
    }

    .shop-title {
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: 58px;
      font-weight: 400;
      margin: 0 0 10px;
    }

    .shop-intro {
      text-align: center;
      margin: 0 auto 35px;
      max-width: 600px;
      line-height: 1.7;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 40px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid rgba(94, 68, 46, 0.18);
      border-radius: 12px;
      background: var(--white);
      color: var(--brown);
      font-family: "Schoolbell", cursive;
      font-size: 14px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .product-card {
      background: var(--white);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(94, 68, 46, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(94, 68, 46, 0.12);
    }

    .product-link {
      display: block;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 17px;
      background: var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      margin-bottom: 16px;
    }

    .product-category {
      color: var(--bistre);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .product-name {
      font-family: "Great Vibes", cursive;
      font-size: 30px;
      font-weight: 400;
      margin-bottom: 5px;
    }

    .product-price {
      font-size: 17px;
      font-weight: 600;
    }

    .shop-button {
      display: block;
      text-align: center;
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: var(--pomegranate);
      color: var(--white);
      font-size: 14px;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 40px 10px;
    }

    footer {
      background: var(--white);
      text-align: center;
      padding: 45px 20px;
      border-top: 1px solid rgba(94, 68, 46, 0.08);
    }

    .footer-logo {
      font-family: "Shadows Into Light Two", cursive;
      font-size: 45px;
      letter-spacing: 2px;
    }

    @media (max-width: 760px) {

      .filters {
        grid-template-columns: 1fr;
      }

      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .product-name {
        font-size: 25px;
      }

      .product-image {
        font-size: 60px;
      }

      nav {
        gap: 13px;
      }
    }

    @media (max-width: 480px) {

      .product-grid {
        grid-template-columns: 1fr;
      }

      .shop-title {
        font-size: 48px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html">
    <div class="logo">AELORIA</div>
  </a>

  <div class="tagline">
    its blessing to be Me
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
  </nav>

</header>


<main class="shop">

  <h1 class="shop-title">
    Shop AELORIA
  </h1>

  <p class="shop-intro">
    Handmade little characters and whimsical clay charms,
    created with love at my artist's desk. 🌷
  </p>


  <div class="filters">

    <input
      type="search"
      id="search"
      placeholder="Search products..."
      oninput="filterProducts()"
    >

    <select id="category" onchange="filterProducts()">

  <option value="all">
    All Categories
  </option>

</select>

    </select>


    <select id="availability" onchange="filterProducts()">

      <option value="all">
        All Products
      </option>

      <option value="available">
        Available
      </option>

      <option value="unavailable">
        Sold Out
      </option>

    </select>

  </div>


  <div class="product-grid" id="productGrid">
</div>


  <div class="empty" id="empty">
    No little AELORIA treasures found. 🌷
  </div>

</main>


<footer>

  <div class="footer-logo">
    AELORIA
  </div>

  <p>
    Hand made & hand painted with love 🌷
  </p>

</footer>

<script>

let allProducts = [];

async function loadShopProducts() {

  try {

    const response =
      await fetch("/api/products");

    const data =
      await response.json();

    if (!data.success) {
      throw new Error("Failed to load products");
    }

    allProducts =
      data.products;

    renderProducts(allProducts);

  } catch (error) {

    console.error(
      "Failed to load shop products:",
      error
    );

    document.getElementById("empty").style.display =
      "block";

  }

}


function renderProducts(products) {

  const productGrid =
    document.getElementById("productGrid");

  const empty =
    document.getElementById("empty");

  productGrid.innerHTML = "";

  if (products.length === 0) {

    empty.style.display = "block";
    return;

  }

  empty.style.display = "none";


  products.forEach(product => {

    const card =
      document.createElement("article");

    card.className =
      "product-card";

    card.dataset.name =
      product.name;

    card.dataset.category =
      product.category_name;

    card.dataset.stock =
      product.stock;


    const price =
      product.sale_price || product.price;


    card.innerHTML = `

      <a
        class="product-link"
        href="product.html?product=${product.id}"
      >

        <div class="product-image">

          ${
            product.image_url
              ? `<img
                   src="${product.image_url}"
                   alt="${product.name}"
                   style="
                     width:100%;
                     height:100%;
                     object-fit:cover;
                     border-radius:17px;
                   "
                 >`
              : "🌷"
          }

        </div>

        <div class="product-category">
          ${product.category_name}
        </div>

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-price">
          ₹${price}
        </div>

      </a>

      <a
        class="shop-button"
        href="product.html?product=${product.id}"
      >
        View Product ♡
      </a>

    `;

    productGrid.appendChild(card);

  });

}


function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const category =
    document
      .getElementById("category")
      .value;

  const availability =
    document
      .getElementById("availability")
      .value;


  const filteredProducts =
    allProducts.filter(product => {

      const matchesSearch =
        product.name
          .toLowerCase()
          .includes(search);


      const matchesCategory =
        category === "all" ||
        product.category_name === category;


      const matchesAvailability =
        availability === "all" ||
        (
          availability === "available" &&
          product.stock > 0
        ) ||
        (
          availability === "unavailable" &&
          product.stock <= 0
        );


      return (
        matchesSearch &&
        matchesCategory &&
        matchesAvailability
      );

    });


  renderProducts(filteredProducts);

}
async function loadShopCategories() {

  try {

    const response =
      await fetch("/api/admin/categories");

    const data =
      await response.json();

    if (!data.success) {
      throw new Error("Failed to load categories");
    }

    const categorySelect =
      document.getElementById("category");

    data.categories.forEach(category => {

      const option =
        document.createElement("option");

      option.value =
        category.name;

      option.textContent =
        category.name;

      categorySelect.appendChild(option);

    });

  } catch (error) {

    console.error(
      "Failed to load shop categories:",
      error
    );

  }

}

loadShopCategories();
loadShopProducts();

</script>


</body>
</html>
