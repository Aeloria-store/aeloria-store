<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop | AELORIA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --vanilla: #FFF8E2;
      --white: #FFFFFF;
      --brown: #5E442E;
      --pomegranate: #C85555;
      --bistre: #767B39;
      --blue: #DDEEF5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--vanilla);
      color: var(--brown);
      font-family: "Playfair Display", serif;
      line-height: 1.6;
    }

    header {
      background: var(--white);
      text-align: center;
      padding: 24px 20px 14px;
      border-bottom: 1px solid rgba(94, 68, 46, 0.12);
    }

    .logo {
      font-family: "Amatic SC", sans-serif;
      font-size: 3.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--brown);
      text-decoration: none;
    }

    .tagline {
      font-size: 0.85rem;
      margin-top: -8px;
      color: var(--bistre);
    }

    nav {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--brown);
      text-decoration: none;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--pomegranate);
    }

    .shop-header {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .shop-header h1 {
      font-family: "Great Vibes", cursive;
      font-size: 3.2rem;
      font-weight: 400;
      color: var(--pomegranate);
      margin-bottom: 8px;
    }

    .shop-header p {
      max-width: 600px;
      margin: auto;
      font-size: 0.95rem;
    }

    .shop-controls {
      max-width: 1100px;
      margin: 0 auto 30px;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .shop-controls input,
    .shop-controls select {
      font-family: "Playfair Display", serif;
      border: 1px solid rgba(94, 68, 46, 0.2);
      background: var(--white);
      color: var(--brown);
      border-radius: 12px;
      padding: 12px 15px;
      outline: none;
      font-size: 0.9rem;
    }

    .shop-controls input {
      width: min(100%, 300px);
    }

    .shop-controls select {
      min-width: 180px;
    }

    .products {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px 70px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .product-card {
      background: var(--white);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(94, 68, 46, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(94, 68, 46, 0.12);
    }

    .product-image {
      height: 270px;
      background: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .product-info {
      padding: 20px;
    }
